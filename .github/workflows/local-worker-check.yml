name: Local worker static checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile automation/local-ollama/worker.py
      - run: python -m unittest discover -s automation/local-ollama -p 'test_*.py' -v
