name: LP visual preview screenshots

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install app and screenshot tooling
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture preview screenshots without publishing
        run: |
          set -eu
          npm run dev -- --hostname 127.0.0.1 > /tmp/misemiru-next.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          mkdir -p preview-screenshots
          npx playwright screenshot --browser chromium --viewport-size "390,844" --full-page http://127.0.0.1:3000/ preview-screenshots/mobile-390.png
          npx playwright screenshot --browser chromium --viewport-size "1440,900" --full-page http://127.0.0.1:3000/ preview-screenshots/desktop-1440.png

      - name: Upload preview images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp-visual-preview
          path: preview-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
